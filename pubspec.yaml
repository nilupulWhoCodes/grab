name: grab
description: "Grab: browse YouTube and save audio as MP3 (personal use)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^2.3.4
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  webview_flutter: ^4.10.0
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  device_info_plus: ^11.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.nilupul --project-name grab .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/grab-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/grab-armv7.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: grab-apk
          path: out/*.apk
          retention-days: 30

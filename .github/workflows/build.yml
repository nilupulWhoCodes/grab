name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.nilupul --project-name grab .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/grab-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/grab-armv7.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: grab-apk
          path: out/*.apk
          retention-days: 30

      # Easy install on the phone: Releases page of the repo.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Grab build ${{ github.run_number }}
          body: Install grab-arm64.apk on most phones (grab-armv7.apk for older 32-bit ones).
          files: out/*.apk
          make_latest: true

      # Copy of the latest APKs on the `apk` branch (fetchable with plain git).
      - name: Update apk branch
        run: |
          cd out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

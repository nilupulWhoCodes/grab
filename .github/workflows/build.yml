name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.nilupul --project-name grab .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      # Permanent release key from repo secrets, so every build can be
      # installed as an update over the previous one.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.GRAB_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.GRAB_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/grab-release.p12
            {
              echo "storeFile=grab-release.p12"
              echo "storePassword=$KEYSTORE_PW"
              echo "keyAlias=grab"
              echo "keyPassword=$KEYSTORE_PW"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GRAB_KEYSTORE_* secrets missing: using a temporary key. This build can't update an installed app and won't be published as a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Version 1.0.<build> / build number <build>: the app compares this
      # number with the latest release tag to offer updates.
      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi \
              --build-name "1.0.${{ github.run_number }}" \
              --build-number "${{ github.run_number }}" \
              --dart-define=GRAB_BUILD=${{ github.run_number }} 2>&1 | tee build.log; then
            # Surface the real error as one annotation (readable via the API).
            msg=$(grep -E "^e: |error:|Error:|What went wrong|Execution failed|> |FAILURE|Exception" build.log \
                  | grep -v "^\s*$" | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build APK failed::${msg}"
            exit 1
          fi

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/grab-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/grab-armv7.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: grab-apk
          path: out/*.apk
          retention-days: 30

      # Easy install on the phone: Releases page of the repo.
      # Only builds signed with the permanent key become releases (the app's
      # updater installs the latest release).
      - name: Publish release
        if: ${{ steps.signing.outputs.signed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n\nInstall grab-arm64.apk on most phones (grab-armv7.apk for older 32-bit ones).\n' \
            "${CHANGES:-New build}" > notes.md
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Grab 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest

      # Copy of the latest APKs on the `apk` branch (fetchable with plain git).
      # Runs even if the release step failed.
      - name: Update apk branch
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          cd out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
